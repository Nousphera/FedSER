name: tests
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[flower,test]' -c requirements-lock-py311.txt
      - run: python -m pip check
      - run: python -m pytest -q
      - run: fedser train --config configs/smoke.json --output runs/ci-smoke
