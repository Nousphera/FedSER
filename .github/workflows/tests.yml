name: tests
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[flower,test]' -c requirements-lock-py311.txt
      - run: python -m pip check
      - run: python -m pytest -q
      - run: fedser train --config configs/smoke.json --output runs/ci-smoke
      - name: Native Flower App smoke
        env:
          FLWR_DISABLE_RUNTIME_DEPENDENCY_INSTALLATION: '1'
        run: |
          flwr run . --stream --run-config "output='$(pwd)/runs/flower-smoke'" \
            --federation-config 'num-supernodes=2 client-resources-num-cpus=1 init-args-num-cpus=2'
