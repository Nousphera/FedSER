[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fedser"
version = "0.1.0"
description = "Speech emotion recognition with federated self-training"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{name = "Vasileios Tsouvalas"}]
dependencies = ["tensorflow==2.20.0", "numpy==1.26.4", "ml-dtypes==0.5.4", "scikit-learn>=1.5,<2"]

[project.optional-dependencies]
flower = ["flwr[simulation]==1.40.0"]
test = ["pytest>=8,<9"]

[project.scripts]
fedser = "fedser.cli:main"

[tool.setuptools.packages.find]
include = ["fedser*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.flwr.app]
publisher = "nousphera"

[tool.flwr.app.components]
serverapp = "fedser.server_app:app"
clientapp = "fedser.client_app:app"

[tool.flwr.app.config]
config = "configs/smoke.json"

[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 2
options.backend.client-resources.num-cpus = 1
options.backend.client-resources.num-gpus = 0.0
